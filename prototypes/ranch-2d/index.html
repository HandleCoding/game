<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#aacc76"><title>一起牧场 · 柔和2.5D小样</title><link rel="stylesheet" href="./style.css"></head>
<body><main><canvas id="scene" aria-label="柔和写实牧场，拖动平移、双指缩放、点击动物"></canvas></main>
<header><a href="/" class="wood brand">一起牧场<small>柔和2.5D小样</small></a><div class="compare wood" role="group" aria-label="对比场景效果"><button id="blended" aria-pressed="true">场景融合</button><button id="original" aria-pressed="false">平面对照</button></div></header>
<aside id="animal-info"><strong id="animal-name">山羊</strong><span id="animal-state">在草地上歇一会儿</span></aside>
<div id="toast" role="status"></div>
<div class="zoom-tools" aria-label="牧场镜头"><button id="zoom-out" aria-label="缩小牧场">−</button><button id="fit">全景</button><button id="zoom-in" aria-label="放大牧场">＋</button></div>
<footer><div id="picker" aria-label="选择牧场动物"></div><nav aria-label="牧场体验操作"><button id="feed"><canvas data-icon="2" aria-hidden="true"></canvas><span>添饲料</span></button><button id="shade"><canvas data-icon="4" aria-hidden="true"></canvas><span>树荫散步</span></button><button id="stage"><canvas data-icon="1" aria-hidden="true"></canvas><span id="stage-text">看看幼年</span></button><button id="gate"><canvas data-icon="5" aria-hidden="true"></canvas><span id="gate-text">开栅栏门</span></button><button id="pause"><span class="pause-icon" aria-hidden="true">Ⅱ</span><span id="pause-text">暂停动画</span></button></nav><p class="hint">拖动平移 · 双指或滚轮缩放 · 点树摇叶</p></footer>
<div id="loading" role="status"><div class="loading-inner"><span class="mark">❧</span><h1>一起牧场</h1><p id="loading-message">铺好草地，让伙伴们准备出门。</p><div class="track"><div id="progress"></div></div><span id="percent">0%</span><button id="retry" hidden>重新加载</button><a href="/">返回大厅</a></div></div><script type="module" src="./main.ts"></script></body></html>
